  <text x="950" y="253" text-anchor="middle" font-family="Arial" font-size="15" fill="#285d30">hash · role</text>
  <path d="M840 380 h220 v105 h-220 q-18 0-18-18 v-69 q0-18 18-18z" fill="#ece8f6" stroke="#68518f" stroke-width="2"/>
  <path d="M840 380 q110 28 220 0" fill="none" stroke="#68518f" stroke-width="2"/>
  <text x="950" y="425" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#473663">Сессия / audit log</text>
  <text x="950" y="453" text-anchor="middle" font-family="Arial" font-size="15" fill="#473663">actor · time · request ID</text>
  <line x1="295" y1="275" x2="495" y2="275" stroke="#345b7e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="495" y1="325" x2="300" y2="325" stroke="#345b7e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="397" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#345b7e">TLS: логин / пароль</text>
  <text x="397" y="350" text-anchor="middle" font-family="Arial" font-size="14" fill="#345b7e">Secure cookie / жауап</text>
  <line x1="730" y1="260" x2="817" y2="235" stroke="#345b7e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="817" y1="265" x2="735" y2="300" stroke="#345b7e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="330" x2="817" y2="410" stroke="#345b7e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="817" y1="455" x2="728" y2="350" stroke="#345b7e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="610" y="580" text-anchor="middle" font-family="Arial" font-size="16" fill="#4d5d6c">STRIDE: spoofing · tampering · repudiation · disclosure · denial of service · elevation of privilege</text>
