<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">FitClub authentication STRIDE threat model</title>
  <desc id="desc">Administrator browser communicates with Auth API, user database, and session audit store across a trust boundary.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#345b7e"/></marker></defs>
  <rect width="1200" height="620" fill="#ffffff"/>
