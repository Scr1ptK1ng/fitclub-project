  <rect x="40" y="95" width="300" height="450" rx="12" fill="#f5f7fa" stroke="#9aa9b5" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="65" y="130" font-family="Arial" font-size="18" font-weight="700" fill="#4d5d6c">Сенімсіз аймақ / Internet</text>
  <rect x="370" y="95" width="790" height="450" rx="12" fill="#f7fbff" stroke="#39739d" stroke-width="3"/>
