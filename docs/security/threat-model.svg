  <text x="190" y="285" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#5d430f">Әкімші / менеджер</text>
  <text x="190" y="315" text-anchor="middle" font-family="Arial" font-size="16" fill="#5d430f">браузері</text>
  <rect x="500" y="230" width="230" height="130" rx="18" fill="#d9ecf7" stroke="#27678f" stroke-width="3"/>
  <text x="615" y="282" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#17324d">Auth және API</text>
  <text x="615" y="315" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324d">RBAC · rate-limit · session</text>
  <path d="M840 180 h220 v105 h-220 q-18 0-18-18 v-69 q0-18 18-18z" fill="#e8f3e8" stroke="#42864b" stroke-width="2"/>
  <path d="M840 180 q110 28 220 0" fill="none" stroke="#42864b" stroke-width="2"/>
